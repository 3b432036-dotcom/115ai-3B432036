name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的預設分支名稱是 master，請改成 master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 如果使用 pnpm 或 yarn，可自行修改

      - name: 安裝依賴套件
        run: npm ci

      - name: 打包專案
        run: npm run build

      - name: 部署至 gh-pages 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 打包後的預設資料夾名稱
          branch: gh-pages
